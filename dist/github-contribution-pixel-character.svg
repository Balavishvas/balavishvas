<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
<title id="title">Retro pixel character GitHub journey</title>
<desc id="desc">A dark retro pixel-art coding scene with a contribution heatmap and an animated original pixel character.</desc>
<style>
