<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1180" height="610" rx="28" fill="#FFFFFF"/>
  <rect x="35" y="35" width="1110" height="540" rx="24" fill="#F8FAFC" stroke="url(#g)" opacity="0.96"/>

  <text x="80" y="140" fill="url(#g)" font-family="monospace" font-size="26" filter="url(#glow)">
    /\_/\\
  </text>
  <text x="80" y="175" fill="url(#g)" font-family="monospace" font-size="26" filter="url(#glow)">
   ( o.o )
  </text>
  <text x="80" y="210" fill="url(#g)" font-family="monospace" font-size="26" filter="url(#glow)">
    > ^ <
  </text>

  <text x="430" y="110" fill="#0F172A" font-size="38" font-family="Arial">Hi 👋 I'm Balavishvas</text>
  <text x="430" y="165" fill="url(#g)" font-size="30" font-family="monospace">
    AI Engineer
    <animate attributeName="opacity" values="1;1;0;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <text x="430" y="225" fill="#0F172A" font-size="20" font-family="monospace">&gt; Generative AI Engineer</text>
  <text x="430" y="255" fill="#0F172A" font-size="20" font-family="monospace">&gt; Python Backend Developer</text>
  <text x="430" y="285" fill="#0F172A" font-size="20" font-family="monospace">&gt; LangChain • LangGraph</text>
  <text x="430" y="315" fill="#0F172A" font-size="20" font-family="monospace">&gt; FastAPI • Node.js • Docker</text>

  <rect x="430" y="365" width="620" height="150" rx="16" fill="#FFFFFF" stroke="url(#g)"/>
  <text x="455" y="400" fill="#0F172A" font-size="22">Featured Projects</text>
  <text x="455" y="435" fill="#0F172A" font-size="18">• TourChain – AI Tourist Safety Monitoring</text>
  <text x="455" y="465" fill="#0F172A" font-size="18">• Effy AI Voice Agent</text>
  <text x="455" y="495" fill="#0F172A" font-size="18">• Building Agentic AI Systems</text>

  <circle cx="1080" cy="90" r="6" fill="#06B6D4">
    <animate attributeName="cy" values="90;80;90" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
